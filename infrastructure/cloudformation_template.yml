AWSTemplateFormatVersion: '2010-09-09'
Description: 'EventFlow - S3 Event Notifications vs EventBridge Infrastructure (AWS Academy Compatible)'

Parameters:
  BucketName:
    Type: String
    Default: 'eventflow-hackathon-data-demo'
    Description: 'Globally unique S3 bucket name'

Resources:
  # S3 Bucket with EventBridge Notification Enabled
  EventFlowBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  # DynamoDB Tables
  EventFlowFilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EventFlowFiles
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: fileId
          AttributeType: S
      KeySchema:
        - AttributeName: fileId
          KeyType: HASH

  EventFlowEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EventFlowEvents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH

  EventFlowRulesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EventFlowRules
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ruleId
          AttributeType: S
      KeySchema:
        - AttributeName: ruleId
          KeyType: HASH

  EventFlowExperimentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EventFlowExperiments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: experimentId
          AttributeType: S
      KeySchema:
        - AttributeName: experimentId
          KeyType: HASH

Outputs:
  BucketName:
    Value: !Ref EventFlowBucket
  EventsTableName:
    Value: !Ref EventFlowEventsTable
